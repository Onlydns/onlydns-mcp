name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build MCP Server
        run: npm run build

      - name: Build MCPB Bundle
        run: |
          npx @anthropic-ai/mcpb validate manifest.json
          npx @anthropic-ai/mcpb pack . onlydns-mcp.mcpb

      - name: Run tests
        run: npm test

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            onlydns-mcp.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Idempotent)
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm. Skipping publish step."
          else
            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm..."
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          MCP_PUBLISHER_VERSION="v1.8.6"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          sudo tar -xzf "$archive" -C /usr/local/bin/ mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Wait for npm package availability
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to propagate on npm registry..."

          MAX_ATTEMPTS=24
          ATTEMPT=0
          until npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "Timeout waiting for npm package propagation after 2 minutes."
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Package not yet visible on registry. Waiting 5s..."
            sleep 5
          done
          echo "Package is confirmed visible on npm. Allowing 5 additional seconds for global CDN sync..."
          sleep 5

      - name: Authenticate to MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry (Idempotent with Retry)
        run: |
          SERVER_NAME=$(node -p "require('./server.json').name")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          ENCODED_SERVER_NAME=$(node -p "encodeURIComponent('${SERVER_NAME}')")

          echo "Checking if ${SERVER_NAME}@${SERVER_VERSION} is already published on MCP Registry..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_SERVER_NAME}/versions/${SERVER_VERSION}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Server ${SERVER_NAME}@${SERVER_VERSION} is already published on MCP Registry (HTTP 200). Skipping publish step."
          else
            echo "Publishing ${SERVER_NAME}@${SERVER_VERSION} to MCP Registry..."
            MAX_RETRIES=5
            COUNT=0
            until mcp-publisher publish; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRIES ]; then
                FINAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_SERVER_NAME}/versions/${SERVER_VERSION}")
                if [ "$FINAL_STATUS" = "200" ]; then
                  echo "Server verified published on registry despite transient CLI response."
                  break
                fi
                echo "MCP Registry publication failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Publication failed, retrying in 10s (attempt $COUNT/$MAX_RETRIES)..."
              sleep 10
            done
          fi
